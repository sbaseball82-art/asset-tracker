# =============================================================
# daily_growth_topics.yml — 毎朝の投稿候補のネタプール
# -------------------------------------------------------------
# ここに書くのは「文言」と「重み」だけ。数値は必ず Python 側の
# builder（src/daily_growth/topics.py）が作る。
# YAML に数字を直書きしても投稿には出ない（QAで落ちる）。
#
# 項目
#   id            … 履歴に残る一意ID。14日間は再利用されない
#   builder       … 数値を作る関数。null なら「データ源が無い話題」
#   requires      … facts のキー。1つでも欠けたら候補にしない
#   params        … builder への引数（成立条件・対象期間など）
#   hook          … 1行目（強い冒頭）。ここだけで意味が通ること
#   numbers       … 具体的な数字の行。入らなければ後ろから落ちる
#   view          … 自分の観察。断定せず一人称の推測形で書く
#   headline      … 画像の見出し
#   designs       … 使ってよいデザイン（3日連続では使われない）
#   relevance / timeliness / clarity … スコアの静的な重み（0〜1）
#   cyclical      … true ならメモリ関連。「シクリカル」を必ず入れる
#
# {placeholder} は builder が作った値に置き換わる。
# =============================================================

topics:

  # ---------------------------------------------------------- 日々の値動き
  - id: dg001
    title: 前日比の中身（どの銘柄が効いたか）
    category: daily_move
    builder: daily_move
    requires: [day, contributions, total_jpy]
    hook: 総資産{total}。前日比{day_pct}（{day_jpy}）でした。
    numbers:
      - いちばん効いたのは{top_label}で{top_pt}、次が{second_label}の{second_pt}。
    view: 全体の数字より、どれが効いたかを見るほうが自分には意味がある気がしています。
    headline: 前日比{day_pct}の内訳
    designs: [dark_financial_report, chart_focus, ratio_visual]
    relevance: 1.0
    timeliness: 0.9
    clarity: 0.9
    tags: ["#資産推移", "#米国株", "#ETF"]

  - id: dg002
    title: 何も起きなかった日
    category: daily_move
    builder: quiet_day
    requires: [quiet, day, holdings, total_jpy]
    hook: 今日は何も起きませんでした。総資産{total}、前日比{day_pct}です。
    numbers:
      - ETF{count}のうち、いちばん動いたものでも{max_pct}でした。
    view: 動かない日の記録もあとで効いてくる気がして、そのまま残しています。
    headline: 動かなかった日
    designs: [light_editorial, magazine_cover, dark_financial_report]
    relevance: 0.9
    timeliness: 0.8
    clarity: 0.8
    tags: ["#資産推移", "#インデックス投資"]

  - id: dg003
    title: 株価と円換算で符号が逆になった日
    category: fx
    builder: fx_decomp
    requires: [fx_decomp, usdjpy, total_jpy]
    params: {require_opposite: true}
    hook: 保有株は{price_word}なのに、円換算の総資産は{total}でした。
    numbers:
      - 株価の値動きが{price}、為替の影響が{fx}。差し引きでこうなりました。
    view: 円で暮らしている以上、見ている数字は株価そのものではないのだと思います。
    headline: 株価{price}／為替{fx}
    designs: [versus, before_after, dark_financial_report]
    relevance: 1.0
    timeliness: 1.0
    clarity: 0.9
    tags: ["#資産推移", "#米国株", "#ドル円"]

  - id: dg004
    title: 前日と逆の動き
    category: daily_move
    builder: reversal
    requires: [reversal, day, total_jpy]
    hook: 昨日{prev_pct}、今日{today_pct}。連日で向きが変わりました。
    numbers:
      - 総資産は{total}、今日の増減は{day_jpy}です。
    view: 2日並べると、1日だけ見て何か言うのは難しいなと感じます。
    headline: 昨日{prev_pct}／今日{today_pct}
    designs: [before_after, versus, chart_focus]
    relevance: 0.9
    timeliness: 1.0
    clarity: 0.85
    tags: ["#資産推移", "#米国株"]

  - id: dg005
    title: 今日の変動は平常の範囲だったか
    category: volatility
    builder: sigma
    requires: [volatility, total_jpy]
    params: {inside: true, band: 1.5}
    hook: 今日の変動{day_pct}は、直近{n}の標準偏差{sigma}の中に収まっていました。
    numbers:
      - ぶれ幅でいうと{z}。金額なら1日あたり{sigma_jpy}くらいが平常です。
    view: 大きく動いた日より、こういう日のほうが多いのだと数えて気づきました。
    headline: 今日の変動は{z}
    designs: [chart_focus, light_editorial, dark_financial_report]
    relevance: 0.85
    timeliness: 0.7
    clarity: 0.8
    tags: ["#資産推移", "#インデックス投資"]

  - id: dg006
    title: 平常より大きく動いた日
    category: volatility
    builder: sigma
    requires: [volatility, total_jpy]
    params: {outside: true, band: 1.5}
    hook: 今日の変動{day_pct}は、直近{n}の平常値から外れました（{z}）。
    numbers:
