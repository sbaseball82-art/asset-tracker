    view: 数字が大きい日ほど、あとから見ると理由づけしたくなるので気をつけたいです。
    headline: 平常の{z}だった日
    designs: [dark_financial_report, chart_focus, magazine_cover]
    relevance: 0.85
    timeliness: 1.0
    clarity: 0.8
    tags: ["#資産推移", "#米国株"]

