# =============================================================
# 保存版コンテンツのネタストック（機能A）
# -------------------------------------------------------------
# - 毎週日曜 21:00 JST に未使用のものから1本選んで生成する
# - last_used に日付が入ると使用済み。90日経過で再利用可能に戻る
#   （数値を更新して再投稿する運用）
# - builder:
#     static             … table/rows をそのまま描画（数値はYAMLに直書き）
#     etf_overlap        … data/cache/etf_constituents.yml から重複を計算
#     checklist_earnings … data/earnings_calendar.yml から決算日程を生成
#     line_sim           … パラメータからシミュレーション折れ線を計算
# - 数値はすべて報道／公表ベースの概算。post.txt に必ずその旨を明記する
# =============================================================
topics:
  - id: ev001
    theme: 高配当ETF比較（VYM / HDV / SCHD / SBI S 米国高配当）の構成銘柄 重複率
    format: table
    builder: etf_overlap
    last_used: null
    params:
      etfs: [VYM, HDV, SCHD]
      note: SBI・S 米国高配当(年4回)はSCHDを通じて投資するため実質SCHDと同じ
    post:
      headline: 高配当ETF、名前は似ていて中身は別物でした
      numbers:
        - "VYM×HDV 上位10銘柄の重複 {overlap_VYM_HDV}社"
        - "VYM×SCHD 重複 {overlap_VYM_SCHD}社"
        - "HDV×SCHD 重複 {overlap_HDV_SCHD}社"
      view: |-
        私はVYMとHDVとSBI S(≒SCHD)を全部持っていますが、
        重複が思ったより少なく、分散として意外と機能している気がします。
      hashtags: ["#高配当ETF", "#米国株"]
    ammo:
      targets:
        - 高配当ETFの比較・乗り換えを話題にしているアカウント
        - 「VYMとSCHDどっちがいい？」系の投稿全般
      drafts:
        - label: 案A（データ提示型）
          text: 上位10銘柄で比べると重複は意外と少ないみたいです。手元で数えた表を置いておきます（公表ベースの概算です）
        - label: 案B（自分の保有と結びつける型）
          text: 私は3本とも保有していますが、中身の重複が少ないので棲み分けできている気がしています。比較表です
        - label: 案C（疑問を投げる型）
          text: 重複率だけ見ると併用に意味がありそうなんですが、皆さんは1本に絞る派ですか？（比較表を添えます）

  - id: ev002
    theme: VTI / VOO / QQQ / FANG+ の上位10社 重複マップ
    format: table
    builder: etf_overlap
    last_used: null
    params:
      etfs: [VTI, VOO, QQQ, FANGPLUS]
      note: FANG+はiFreeNEXT FANG+の連動指数（NYSE FANG+・等ウェイト）
    post:
      headline: VTIもVOOもQQQもFANG+も、上位は結局ほぼ同じ顔ぶれでした
      numbers:
        - "VTI×VOO 上位10社の重複 {overlap_VTI_VOO}社"
        - "VTI×QQQ 重複 {overlap_VTI_QQQ}社"
        - "QQQ×FANG+ 重複 {overlap_QQQ_FANGPLUS}社"
      view: |-
        私はVTIとQQQとFANG+を併用していますが、上位の顔ぶれはほぼ同じで、
        違いは「上位への集中度」なのだと思っています。
      hashtags: ["#インデックス投資", "#米国株"]
    ammo:
      targets:
        - VTI/VOO論争、QQQ追加の是非を話題にしているアカウント
        - 「結局どのインデックスがいい？」系の投稿
      drafts:
        - label: 案A（データ提示型）
          text: 上位10社を並べると重複はこんな感じでした。違いは銘柄よりも集中度みたいです（概算の表を添えます）
        - label: 案B（自分の保有と結びつける型）
          text: 私はVTI＋QQQ＋FANG+の三段重ねですが、これは同じ銘柄を段階的に濃くしているだけだと表を作って気づきました
        - label: 案C（疑問を投げる型）
          text: 上位がここまで同じだと、複数持ちは分散ではなく傾斜配分ですよね。皆さんは何本持ちですか？

  - id: ev003
    theme: 米国株の7月アノマリー 過去20年（平均+2.6% / 勝率16勝4敗）
    format: table
    builder: static
    last_used: null
    table:
      title: S&P500 月別アノマリー（過去20年・概算）
      subtitle: 報道・公表データベースの概算 / 月次リターン平均と勝率
      columns:
        - {label: 月}
        - {label: 平均リターン, num: true}
        - {label: 勝率, num: true}
      rows:
        - {cells: [4月, "+1.9%", 15勝5敗]}
        - {cells: [7月, "+2.6%", 16勝4敗], highlight: true}
        - {cells: [11月, "+2.2%", 15勝5敗]}
        - {cells: [2月, "-0.1%", 11勝9敗]}
        - {cells: [9月, "-1.2%", 9勝11敗]}
    post:
      headline: 7月の米国株、過去20年で16勝4敗でした
      numbers:
        - 7月の平均リターン +2.6%（過去20年・概算）
        - 勝率は16勝4敗で12ヶ月中トップクラス
        - 逆に9月は平均-1.2%で最弱月
      view: |-
        アノマリーで売買はしませんが、「7月に強気記事が増える理由」を
        知っておくと、ニュースに振られにくくなる気がしています。
      hashtags: ["#米国株", "#アノマリー"]
    ammo:
      targets:
        - 月初・月末に相場振り返りを投稿する大型アカウント
        - 「夏枯れ相場」「セルインメイ」に言及した投稿
      drafts:
        - label: 案A（データ提示型）
          text: 過去20年だと7月は16勝4敗・平均+2.6%みたいです。月別の表を置いておきます（概算です）
        - label: 案B（自分の保有と結びつける型）
          text: この数字を見ても私は積立を止めない派ですが、7月と9月の差は頭に入れておくようにしています
        - label: 案C（疑問を投げる型）
          text: アノマリーって意識されるほど消えると言われますが、7月の強さは残っていますよね。偶然だと思いますか？

  - id: ev004
    theme: CAPEレシオ41.59の読み方と、過去の高水準期のその後
    format: table
    builder: static
    last_used: null
    table:
      title: CAPEレシオ 高水準期とその後（概算）
      subtitle: 報道・公表データベースの概算 / Shiller CAPE
      columns:
        - {label: 時期}
        - {label: CAPE, num: true}
        - {label: その後}
      rows:
        - {cells: [1929年, 約33, 大恐慌で長期低迷]}
        - {cells: [2000年, 約44, ITバブル崩壊 -49%]}
        - {cells: [2021年, 約38, 2022年に-25%調整]}
        - {cells: [現在, 約41.6, 「？」], highlight: true}
    post:
      headline: CAPEレシオ41.59は、2000年（約44）に次ぐ歴史的水準です
      numbers:
        - 現在のCAPE 約41.6（公表ベースの概算）
        - ITバブル天井の2000年は約44 → その後-49%
        - 2021年は約38 → 翌年-25%
      view: |-
        高CAPEはタイミングを教えてくれませんが、「今後10年の期待リターンが
        低め」というサインだとは受け止めています。だから私は積立額を変えず、
        期待値だけ下げておく方針です。
      hashtags: ["#米国株", "#CAPEレシオ"]
    ammo:
      targets:
        - バリュエーション警戒論・暴落論を扱うアカウント
        - 「米国株は割高？」系の投稿
      drafts:
        - label: 案A（データ提示型）
          text: 過去の高CAPE期を並べた表です。41.6は歴史的には2000年に次ぐ水準みたいです（概算）
        - label: 案B（自分の保有と結びつける型）
          text: 私はこの水準でも積立は止めず、期待リターンの見積もりだけ下げるようにしています
        - label: 案C（疑問を投げる型）
          text: CAPEが高くても上げ続けた2010年代を見ると、水準だけで判断できない気もします。皆さんは参考にしていますか？

  - id: ev005
    theme: 投資信託 vs ETF：課税繰延の差を保有年数別に試算
    format: table
    builder: static
    last_used: null
    table:
      title: 分配金あり(ETF) vs 分配金なし(投信) 課税の差
      subtitle: 概算試算 / 年利5%・配当相当2%・税率20.315%・100万円スタート
      columns:
        - {label: 保有年数}
        - {label: ETF(都度課税), num: true}
        - {label: 投信(繰延), num: true}
        - {label: 差, num: true}
      rows:
        - {cells: [10年, 約155万円, 約158万円, 約3万円]}
        - {cells: [20年, 約240万円, 約252万円, 約12万円]}
        - {cells: [30年, 約372万円, 約404万円, 約32万円], highlight: true}
    post:
      headline: 分配金への課税だけで、30年で約32万円の差になる試算です
      numbers:
        - 100万円を年5%で運用、配当相当2%に都度課税した場合の概算
        - 10年では差は約3万円
        - 30年だと約32万円（元本の3割相当）に拡大
      view: |-
        私はETFの分配金も好きなので両方持っていますが、「配当を使わず
        再投資するお金」は投信側に寄せるのが合理的だと考えています。
      hashtags: ["#投資信託", "#ETF"]
    ammo:
      targets:
        - 投信 vs ETF論争、新NISAの商品選びを扱うアカウント
        - 「分配金は再投資すべき？」系の投稿
      drafts:
        - label: 案A（データ提示型）
          text: 課税繰延の差を年数別に試算した表です。30年で約32万円の差になりました（前提は表に記載・概算です）
        - label: 案B（自分の保有と結びつける型）
          text: 私は「使う配当はETF、使わない分は投信」で分けています。この試算がその理由です
        - label: 案C（疑問を投げる型）
          text: 繰延の差は数字では投信有利ですが、分配金のモチベーション効果も無視できない気がします。どちら派ですか？

