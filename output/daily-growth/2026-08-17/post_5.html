<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:1180px; height:1450px; background:#0B1220; color:#FFFFFF;
  font-family:'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans',sans-serif; padding:56px 64px 40px;
  display:flex; flex-direction:column; overflow:hidden;
}
.num { font-variant-numeric:tabular-nums; font-feature-settings:'tnum' 1; }
.up { color:#6EE7A8; } .down { color:#F08A8A; } .flat { color:#FFFFFF; }

header { display:flex; justify-content:space-between; align-items:flex-start;
  padding-bottom:18px; border-bottom:2px solid #1E2A42; }
.kicker { font-size:24px; font-weight:700; color:#4A9EFF;
  letter-spacing:.06em; }
.asof { font-size:20px; color:#8B96AB; margin-top:8px; }
.acct { font-size:20px; color:#8B96AB; font-weight:700; text-align:right; }

main { flex:1; display:flex; flex-direction:column;
  justify-content:space-evenly; gap:18px; padding:8px 0; }

.headline { font-size:52px; font-weight:700; line-height:1.28;
  letter-spacing:.01em; }

.hero { }
.hero-label { font-size:24px; color:#8B96AB; }
.hero-value { font-size:72px; font-weight:700; line-height:1.02;
  margin-top:10px; letter-spacing:-.01em; }
.hero-delta { font-size:28px; margin-top:16px; color:#8B96AB; }

.figure { background:#111A2E; border-radius:18px;
  padding:30px 32px; }
.fig-note { font-size:20px; color:#8B96AB; margin-top:20px;
  line-height:1.45; }

.bars { display:flex; flex-direction:column; gap:20px; }
.bar-row { display:grid; grid-template-columns:250px 1fr 190px;
  align-items:center; column-gap:20px; }
.bar-label { font-size:24px; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; }
.bar-track { height:22px; background:#16203A; border-radius:11px; }
.bar-fill { height:22px; border-radius:11px; background:#4A9EFF; }
.bar-fill.up { background:#6EE7A8; } .bar-fill.down { background:#F08A8A; }
.bar-value { font-size:28px; font-weight:700; text-align:right; }

.compare { display:grid; grid-template-columns:1fr 2px 1fr; align-items:stretch;
  column-gap:28px; }
.cmp { padding:8px 4px; }
.cmp-div { background:#1E2A42; }
.cmp-label { font-size:23px; color:#8B96AB; line-height:1.35; }
.cmp-value { font-size:60px; font-weight:700; margin-top:14px;
  line-height:1.05; }
.cmp-note { font-size:21px; color:#8B96AB; margin-top:14px; }

.prog { }
.prog-ends { display:flex; justify-content:space-between; font-size:26px;
  color:#8B96AB; margin-bottom:16px; }
.prog-track { height:34px; background:#16203A; border-radius:17px; }
.prog-fill { height:34px; border-radius:17px; background:#E0B45C; }

.fig-table { width:100%; border-collapse:collapse; }
.fig-table th { font-size:21px; color:#8B96AB; font-weight:700;
  padding:0 8px 14px; border-bottom:1px solid #1E2A42; }
.fig-table td { font-size:27px; padding:15px 8px;
  border-bottom:1px solid #1E2A42; }
.fig-table tr:last-child td { border-bottom:none; }
.left { text-align:left; } .right { text-align:right; }

.spark svg { width:100%; height:300px; display:block; }
.spark-line { fill:none; stroke:#4A9EFF; stroke-width:5;
  vector-effect:non-scaling-stroke; }
.spark-area { fill:#4A9EFF; opacity:.13; stroke:none; }
.spark-ends { display:flex; justify-content:space-between; font-size:21px;
  color:#8B96AB; margin-top:14px; }

.notes { display:flex; flex-direction:column; gap:12px; }
.note { font-size:22px; color:#8B96AB; line-height:1.5; }
.assumption { border-left:5px solid #E0B45C;
  padding:8px 0 8px 20px; font-size:22px; color:#8B96AB; line-height:1.5; }

footer { margin-top:auto; padding-top:22px; display:flex;
  justify-content:space-between; align-items:flex-end;
  border-top:1px solid #1E2A42; }
.f-note { font-size:19px; color:#8B96AB; }
.f-brand { font-size:21px; font-weight:700; color:#E0B45C;
  letter-spacing:.10em; }
</style></head><body>
