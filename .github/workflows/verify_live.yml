name: verify-live

# data/fund_map.yml に書いた全 source に実アクセスして、どれが生きているかを確かめる。
# 本番投入前に手で1回流すためのもの（定期実行はしない）。
# 週次の予兆検知は source_health.yml のほう。

on:
  workflow_dispatch:
    inputs:
      fund:
        description: "このファンドIDだけ試す（空なら全部）"
        required: false
        default: ""
      include_excluded:
        description: "coverage_policy: excluded のファンドも試す"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify all sources
        id: verify
        continue-on-error: true   # 全滅ファンドがあると終了コード2。レポートは残す
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.fund }}" ]; then
            ARGS="$ARGS --fund ${{ github.event.inputs.fund }}"
          fi
          if [ "${{ github.event.inputs.include_excluded }}" = "true" ]; then
            ARGS="$ARGS --include-excluded"
          fi
          python scripts/verify_live.py $ARGS

      - name: Show report in job summary
        run: cat reports/live_verification.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: live-verification
          path: reports/live_verification.md
          retention-days: 90

      - name: Commit report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"

          mkdir -p "$RUNNER_TEMP/gen"
          cp -r reports "$RUNNER_TEMP/gen/" 2>/dev/null || true

          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard
            git checkout -B "$BRANCH" "origin/$BRANCH"
            cp -r "$RUNNER_TEMP/gen/reports/." reports/ 2>/dev/null || true
            git add reports
            if git diff --cached --quiet; then
              echo "変更なし(コミットをスキップ)"; exit 0
            fi
            git commit -m "verify-live: $(date -u +%Y-%m-%d)"
            if git push origin "$BRANCH"; then exit 0; fi
            echo "::warning::push拒否 (試行 $i)。5秒後に再試行"; sleep 5
          done
          echo "::error::5回試行してもpushできませんでした"; exit 1

      - name: Report result
        run: |
          if [ "${{ steps.verify.outcome }}" = "failure" ]; then
            echo "::warning::すべてのsourceが失敗したファンドがあります。"
            echo "reports/live_verification.md を見て、data/manual/ にCSVを置くか"
            echo "coverage_policy を excluded にしてください。"
          else
            echo "全ファンドで少なくとも1つのsourceが成功しました。"
          fi
